{% set name = "fdasrsf" %}
{% set version = "2.6.10" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fdasrsf-{{ version }}.tar.gz
  sha256: 0108d01ca3aeace0abd1131f4928f16aa833e88dfb93b6b4e4f87d0b7c018102

build:
  skip: true  # [py<310]
  number: 2
  # --no-build-isolation is the key change: without it pip ignores the host
  # env and downloads setuptools/wheel/cffi/Cython/findblas/numpy from PyPI,
  # so the extensions get compiled against whatever numpy PyPI happens to
  # offer for that interpreter (2.2.6 on py310, 2.4.6 on py311, 2.5.2 on
  # py312+) rather than against the conda-forge numpy in host.
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - python                               # [build_platform != target_platform]
    - cross-python_{{ target_platform }}   # [build_platform != target_platform]
    - numpy                                # [build_platform != target_platform]
    - cython                               # [build_platform != target_platform]
    - cffi >=1.0.0                         # [build_platform != target_platform]
    - findblas                             # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    # upstream pyproject caps this: requires = ["setuptools<=73.0.1", ...].
    # With build isolation removed, the cap has to be honoured here instead.
    - setuptools <=73.0.1
    - wheel
    - numpy
    - cffi >=1.0.0
    - findblas
    - cython >=0.29.17
    # findblas links the extensions against BLAS at build time
    - libblas
    - libcblas
    - liblapack
    - blas-devel
  run:
    - python
    - numpy >=1.25
    - cffi >=1.0.0
    - cython >=0.29.17
    - joblib >=0.16.0
    - matplotlib-base
    - numba >=0.51.2
    - patsy
    - pyparsing
    - scipy >=1.14
    - six
    - tqdm

test:
  imports:
    - fdasrsf
    # exercise the compiled extensions, not just the pure-python package
    - optimum_reparamN2
    - cbayesian
    - crbfgs
    - cimage
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://research.tetonedge.net
  summary: functional data analysis using the square root slope framework
  license: BSD-3-Clause
  license_file: LICENSE.txt
  description: |
    A python package for functional data analysis using the square root
    slope framework and curves using the square root velocity framework
    which performs pair-wise and group-wise alignment as well as modeling
    using functional component analysis and regression.
  doc_url: https://fdasrsf-python.readthedocs.io/
  dev_url: https://github.com/jdtuck/fdasrsf_python

extra:
  recipe-maintainers:
    - jdtuck

{% set name = "fdasrsf" %}
{% set version = "2.7.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fdasrsf-{{ version }}.tar.gz
  sha256: 6f2f42ad95cad17b15c994ddd36df8654e794173057b6863697fceb2c72d5d0e

build:
  skip: true  # [py<310]
  number: 2
  # --no-build-isolation is the key change: without it pip ignores the host
  # env and downloads setuptools/wheel/cffi/Cython/findblas/numpy from PyPI,
  # so the extensions get compiled against whatever numpy PyPI happens to
  # offer for that interpreter (2.2.6 on py310, 2.4.6 on py311, 2.5.2 on
  # py312+) rather than against the conda-forge numpy in host.
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - python                               # [build_platform != target_platform]
    - cross-python_{{ target_platform }}   # [build_platform != target_platform]
    - numpy                                # [build_platform != target_platform]
    - cython                               # [build_platform != target_platform]
    - cffi >=1.0.0                         # [build_platform != target_platform]
    - findblas                             # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    # Mirrors upstream pyproject's build-system requires, which dropped the old
    # setuptools<=73.0.1 cap in fdasrsf_python#78 (CVE-2025-47273 /
    # CVE-2026-59890).  --no-build-isolation means pip does not install or
    # verify those requires itself, so this env is what the build actually sees.
    - setuptools >=83.0.0
    - wheel
    - numpy
    - cffi >=1.0.0
    - findblas
    - cython >=0.29.17
    # crbfgs is the only extension that needs BLAS: rbfgs.cpp uses Armadillo's
    # norm()/dot(), and the vendored armadillo_bits/config.hpp sets
    # ARMA_USE_BLAS without ARMA_USE_WRAPPER, so the .so references dnrm2_,
    # ddot_, dasum_ and dgemv_ directly and must be linked against BLAS.
    #
    # These three are the BLAS-interface metapackages that provide those
    # symbols.  Do NOT add blas-devel here: it turns blas_impl into a build
    # variant, and the 2026.09.16 pinnings resolved that variant to *netlib,
    # which is what regressed the crbfgs link (ImportError: undefined symbol:
    # dnrm2_ at test time, since ELF allows unresolved symbols until dlopen).
    - libblas
    - libcblas
    - liblapack
  run:
    - python
    - numpy >=1.25
    - cffi >=1.0.0
    - cython >=0.29.17
    - joblib >=0.16.0
    - matplotlib-base
    - numba >=0.51.2
    - patsy
    - pyparsing
    - scipy >=1.14
    - six
    - tqdm

test:
  imports:
    - fdasrsf
    # exercise the compiled extensions, not just the pure-python package
    - optimum_reparamN2
    - cbayesian
    - crbfgs
    - cimage
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://research.tetonedge.net
  summary: functional data analysis using the square root slope framework
  license: BSD-3-Clause
  license_file: LICENSE.txt
  description: |
    A python package for functional data analysis using the square root
    slope framework and curves using the square root velocity framework
    which performs pair-wise and group-wise alignment as well as modeling
    using functional component analysis and regression.
  doc_url: https://fdasrsf-python.readthedocs.io/
  dev_url: https://github.com/jdtuck/fdasrsf_python

extra:
  recipe-maintainers:
    - jdtuck
